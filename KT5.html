<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Машинка</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        body {

            overflow: hidden;

        }

        .scene {

            position: relative;

            width: 100%;

            height: 100vh;

            background: linear-gradient(#87CEEB 70%, #90C76B 70%);

        }

        /* Солнце */

        .sun {

            position: absolute;

            top: 50px;

            right: 150px;

            width: 80px;

            height: 80px;

            background: yellow;

            border-radius: 50%;

        }

        /* Машинка */

        .car {

            position: absolute;

            left: -200px;

            bottom: 105px;

            width: 200px;

            height: 90px;

            animation: drive 5s ease-in-out forwards;

        }

        .body {

            position: absolute;

            bottom: 10px;

            width: 200px;

            height: 45px;

            background: red;

            border-radius: 20px 30px 10px 10px;

            border: 3px solid darkred;

        }

        .roof {

            position: absolute;

            bottom: 45px;

            left: 40px;

            width: 120px;

            height: 45px;

            background: red;

            border: 3px solid darkred;

            border-radius: 50px 50px 0 0;

        }

        .window {

            position: absolute;

            bottom: 50px;

            width: 45px;

            height: 30px;

            background: lightblue;

            z-index: 1;

        }

        .window1 {

            left: 50px;

            border-radius: 20px 5px 0 0;

        }

        .window2 {

            left: 103px;

            border-radius: 5px 20px 0 0;

        }

        /* Колёса */

        .wheel {

            position: absolute;

            bottom: 0;

            width: 40px;

            height: 40px;

            background: black;

            border: 5px solid #333;

            border-radius: 50%;

            z-index: 2;

        }

        .wheel1 {

            left: 25px;

        }

        .wheel2 {

            right: 25px;

        }

        /* Дорога */

        .road {

            position: absolute;

            bottom: 0;

            width: 100%;

            height: 105px;

            background: #555;

        }

        .road::after {

            content: "";

            position: absolute;

            top: 50px;

            width: 100%;

            border-top: 5px dashed white;

        }

        /* Анимация движения */

        @keyframes drive {

            from {

                transform: translateX(0);

            }

            to {

                transform: translateX(calc(100vw - 50px));

            }

        }

    </style>

</head>

<body>

    <div class="scene">

        <div class="sun"></div>

        <div class="car">

            <div class="body"></div>

            <div class="roof"></div>

            <div class="window window1"></div>

            <div class="window window2"></div>

            <div class="wheel wheel1"></div>

            <div class="wheel wheel2"></div>

        </div>

        <div class="road"></div>

    </div>

</body>

</html>
